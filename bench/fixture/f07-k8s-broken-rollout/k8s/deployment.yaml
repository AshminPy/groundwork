apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  labels: {app: checkout-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: checkout}
  template:
    metadata:
      labels: {app: checkout-api, tier: backend}
    spec:
      containers:
        - name: api
          image: registry.example.com/checkout-api:3.4.1
          ports:
            - name: web
              containerPort: 8080
          env:
            - name: DB_POOL_SIZE
              valueFrom:
                configMapKeyRef: {name: checkout-config, key: db_pool}
